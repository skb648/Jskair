name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        run: sdkmanager "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :gesture-engine:test :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify debug APK
        run: |
          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "targetSdkVersion:'37'"
          permissions="$($AAPT dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          ! grep -q 'android.permission.INTERNET' <<< "$permissions"
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' <<< "$permissions"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        run: sdkmanager "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
      - name: Validate signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace lintRelease
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify release APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "targetSdkVersion:'37'"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Android 17 Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-debug-apk
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK and emulator
        run: |
          sdkmanager "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools" "emulator" "system-images;android-37.0;google_apis;x86_64"
          yes | sdkmanager --licenses >/dev/null || true
          echo no | avdmanager create avd --force --name android17 --package "system-images;android-37.0;google_apis;x86_64" --device "pixel_5"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 17 emulator
        run: |
          nohup emulator -avd android17 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back emulated -camera-front emulated > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | grep -m 1 "1"; do sleep 2; done'
      - name: Run Android 17 instrumented tests
        run: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android17-instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            /tmp/emulator.log
          if-no-files-found: warn
          retention-days: 14
