name: Build Android APKs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  verify:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" platform-tools || \
            "$SDKMANAGER" --channel=3 --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :gesture-engine:test
      - name: Compile instrumented test sources
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugAndroidTestKotlin

  build-debug:
    name: Build debug APK
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" platform-tools || \
            "$SDKMANAGER" --channel=3 --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.aircontrol.debug'"
          echo "$BADGING" | grep -q "targetSdkVersion:'37'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: Build signed release APK
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" platform-tools || \
            "$SDKMANAGER" --channel=3 --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Resolve monotonic versionCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE="${GITHUB_RUN_NUMBER:-2}"
          if [ "$CANDIDATE" -lt 2 ]; then CANDIDATE=2; fi
          LATEST_TAG="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty' || true)"
          if [ -n "$LATEST_TAG" ]; then
            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT
            if gh release download "$LATEST_TAG" --dir "$TMP_DIR" --pattern '*.apk' --clobber 2>/dev/null; then
              PREVIOUS_APK="$(find "$TMP_DIR" -type f -name '*.apk' | head -n 1 || true)"
              if [ -n "$PREVIOUS_APK" ]; then
                PREVIOUS_BADGING="$($ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt dump badging "$PREVIOUS_APK" || true)"
                PREVIOUS_VERSION_CODE="$(printf '%s\n' "$PREVIOUS_BADGING" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
                if [ -n "$PREVIOUS_VERSION_CODE" ] && [ "$CANDIDATE" -le "$PREVIOUS_VERSION_CODE" ]; then
                  CANDIDATE=$((PREVIOUS_VERSION_CODE + 1))
                fi
              fi
            fi
          fi
          echo "Resolved monotonic VERSION_CODE=$CANDIDATE"
          echo "RESOLVED_VERSION_CODE=$CANDIDATE" >> "$GITHUB_ENV"
      - name: Materialize release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using repository secret release keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            chmod 600 app/release.keystore
            echo "EFFECTIVE_KS_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_ALIAS=${KEY_ALIAS:-release}" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret configured; generating self-signed CI release keystore"
            FALLBACK_PASS="aircontrol_ci_release_2026"
            FALLBACK_ALIAS="release"
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -storetype PKCS12 \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -alias "$FALLBACK_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AirControl, OU=Mobile, O=AirControl, L=Unknown, ST=Unknown, C=US"
            chmod 600 app/release.keystore
            echo "EFFECTIVE_KS_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_ALIAS=$FALLBACK_ALIAS" >> "$GITHUB_ENV"
          fi
          test -s app/release.keystore
      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ env.RESOLVED_VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ env.EFFECTIVE_KS_PASSWORD }}
          KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.EFFECTIVE_KEY_ALIAS }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify release APK signature and manifest
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.aircontrol'"
          echo "$BADGING" | grep -q "targetSdkVersion:'37'"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "Release versionCode=$VERSION_CODE versionName=$VERSION_NAME"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove release keystore
        if: always()
        run: rm -f app/release.keystore
