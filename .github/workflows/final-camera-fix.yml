name: Final Camera Lifecycle Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch wake tracking lifecycle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aircontrol/accessibility/GestureControlAccessibilityService.kt')
          s = p.read_text()
          old = '''    private fun wakeTracking() {\n        startTrackingPipeline()\n        cameraRetryAttempt = 0\n        if (currentPreferences.gesturesEnabled && MainActivity.isVisible) startCameraService()\n    }'''
          new = '''    private fun wakeTracking() {\n        startTrackingPipeline()\n        cameraRetryAttempt = 0\n        if (!currentPreferences.gesturesEnabled) return\n\n        // Unlocking is a background event. If the existing camera foreground\n        // service is still alive but paused, resume its already-created FGS here;\n        // this does not create a new camera FGS and is safe after unlock. If the\n        // service is gone entirely, defer creation of a new camera FGS until the\n        // visible Activity owns the foreground-start opportunity.\n        if (cameraServiceManager?.isTracking() == true) {\n            runCatching { cameraServiceManager?.resumeTracking() }\n                .onFailure { Timber.e(it, "Failed to resume existing camera service after unlock") }\n        } else if (MainActivity.isVisible) {\n            startCameraService()\n        } else {\n            Timber.v("Unlock: camera service absent; new camera FGS deferred until AirControl is visible")\n        }\n    }'''
          if old not in s:
              raise SystemExit('Expected wakeTracking block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aircontrol/accessibility/GestureControlAccessibilityService.kt
          git commit -m 'fix: resume existing camera service safely after unlock'
          git push origin HEAD:main
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          rm -f .github/workflows/final-camera-fix.yml
          git add .github/workflows/final-camera-fix.yml
          git commit -m 'chore: remove one-shot camera lifecycle workflow'
          git push origin HEAD:main
