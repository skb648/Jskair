name: Android 17 Camera Fix Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip generated follow-up commits
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fxq 'chore: apply Android 17 camera fixes'; then
            echo 'Migration commit already applied.'
            exit 0
          fi

      - name: Apply Android 17 and camera lifecycle fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          replace('gradle/libs.versions.toml', 'agp = "8.9.2"', 'agp = "9.1.1"')
          replace('gradle/libs.versions.toml', 'kotlin = "2.0.21"', 'kotlin = "2.2.10"')
          replace('gradle/libs.versions.toml', 'ksp = "2.0.21-1.0.28"', 'ksp = "2.2.10-2.0.2"')
          replace('gradle/libs.versions.toml', 'robolectric = "4.14.1"', 'robolectric = "4.17"')
          replace('gradle/wrapper/gradle-wrapper.properties', 'gradle-8.11.1-bin.zip', 'gradle-9.3.1-bin.zip')
          replace('app/build.gradle.kts', 'compileSdk = 35', 'compileSdk = 37')
          replace('app/build.gradle.kts', 'targetSdk = 35', 'targetSdk = 37')

          gp = Path('gradle.properties')
          g = gp.read_text()
          if 'android.builtInKotlin=false' not in g:
              g += '\n# Keep the existing explicit Kotlin/KSP plugins compatible with AGP 9.x.\nandroid.builtInKotlin=false\n'
              gp.write_text(g)

          replace('app/src/main/AndroidManifest.xml',
                  'android:name="android.hardware.camera"\n        android:required="false"',
                  'android:name="android.hardware.camera"\n        android:required="true"')

          camera = 'app/src/main/java/com/aircontrol/camera/CameraService.kt'
          replace(camera,
                  '        publishState(ServiceState(isRunning = true, isPaused = false))\n\n        withContext(Dispatchers.Default) { handTracker.initialize() }',
                  '        // Service is starting; report a live session only after CameraX binds.\n        publishState(ServiceState(isRunning = false, isPaused = false))\n\n        withContext(Dispatchers.Default) { handTracker.initialize() }')
          replace(camera,
                  '            publishState(ServiceState(isRunning = true, isPaused = false))\n            userPaused = false',
                  '            // CameraX bind succeeded; now report the session as live.\n            publishState(ServiceState(isRunning = true, isPaused = false))\n            userPaused = false')

          a11y = 'app/src/main/java/com/aircontrol/accessibility/GestureControlAccessibilityService.kt'
          replace(a11y,
                  'if (!cachedKeyguardLocked && prefs.gesturesEnabled &&\n                    cameraServiceManager?.isTracking() != true) startCameraService()',
                  'if (!cachedKeyguardLocked && prefs.gesturesEnabled &&\n                    MainActivity.isVisible && cameraServiceManager?.isTracking() != true) startCameraService()')
          replace(a11y,
                  'if (currentPreferences.gesturesEnabled) startCameraService()',
                  'if (currentPreferences.gesturesEnabled && MainActivity.isVisible) startCameraService()')
          replace(a11y,
                  'wantsTracking && !isTracking -> {\n                        Timber.w("Watchdog: gestures enabled but the camera session is dead — reviving")\n                        startCameraService()\n                    }',
                  'wantsTracking && !isTracking && MainActivity.isVisible -> {\n                        Timber.w("Watchdog: gestures enabled and Activity is visible — reviving camera")\n                        startCameraService()\n                    }\n                    wantsTracking && !isTracking -> {\n                        Timber.v("Watchdog: camera restart deferred until AirControl is visible")\n                    }')
          replace(a11y,
                  '    private fun startCameraService() {\n        if (!currentPreferences.gesturesEnabled) return',
                  '    private fun startCameraService() {\n        if (!currentPreferences.gesturesEnabled) return\n        if (!MainActivity.isVisible) {\n            Timber.v("Camera start deferred: AirControl Activity is not visible")\n            return\n        }')
          replace(a11y,
                  'if (currentPreferences.gesturesEnabled && cameraServiceManager?.isTracking() != true) {\n                startCameraService()\n            }',
                  'if (currentPreferences.gesturesEnabled && MainActivity.isVisible &&\n                cameraServiceManager?.isTracking() != true) {\n                startCameraService()\n            }')

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('`compileSdk 35`, `minSdk 26`, Kotlin 2.0.21, AGP 8.9.2, Gradle 8.11.1',
                        '`compileSdk 37`, `minSdk 26`, targetSdk 37, Kotlin 2.2.10, AGP 9.1.1, Gradle 9.3.1')
          readme.write_text(r)
          PY

      - name: Validate changes
        shell: bash
        run: |
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'agp = "9.1.1"' gradle/libs.versions.toml
          grep -q 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q 'MainActivity.isVisible' app/src/main/java/com/aircontrol/accessibility/GestureControlAccessibilityService.kt
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app gradle gradle.properties README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'chore: apply Android 17 camera fixes'
          git push origin HEAD:main

      - name: Remove one-shot migration workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          rm -f .github/workflows/android17-fix.yml
          git add .github/workflows/android17-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove one-shot Android 17 migration workflow'
          git push origin HEAD:main
